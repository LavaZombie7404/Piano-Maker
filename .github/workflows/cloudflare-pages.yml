name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: piano-maker
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN nu e setat - sar peste Cloudflare Pages."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Cloudflare credentials
        if: steps.secrets.outputs.ok == 'true'
        run: |
          id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          # spații / rânduri noi lipite din greșeală în token
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]"'''')
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
| tr -d '[:space:]')
          accounts=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
          if [ "$(echo "$accounts" | jq -r .success)" != true ]; then
            echo "::error::Tokenul nu e acceptat de Cloudflare: $(echo "$accounts" | jq -c '.errors')"
            exit 1
          fi
          echo "Tokenul vede $(echo "$accounts" | jq '.result | length') cont(uri)."
          # Account ID lipsă sau greșit: îl luăm din token, dacă tokenul vede un singur cont
          if ! printf '%s' "$id" | grep -Eq '^[0-9a-f]{32}$' || ! echo "$accounts" | jq -e --arg id "$id" '.result | map(.id) | index($id)' >/dev/null; then
            if [ "$(echo "$accounts" | jq '.result | length')" = 1 ]; then
              id=$(echo "$accounts" | jq -r '.result[0].id')
              echo "::notice::Folosesc contul Cloudflare al tokenului (CLOUDFLARE_ACCOUNT_ID lipsă sau greșit)."
            fi
          fi
          n=$(echo "$accounts" | jq '.result | length')
          if ! printf '%s' "$id" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::Nu am un Account ID bun: CLOUDFLARE_ACCOUNT_ID nu are 32 de caractere 0-9a-f (are ${#id}), iar tokenul vede $n conturi."
            exit 1
          fi
          if [ "$n" != 0 ] && ! echo "$accounts" | jq -e --arg id "$id" '.result | map(.id) | index($id)' >/dev/null; then
            echo "::error::Tokenul nu are acces la contul din CLOUDFLARE_ACCOUNT_ID (ID greșit sau token pe alt cont)."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          echo "Cheile sunt în regulă."
      - name: Build site
        if: steps.secrets.outputs.ok == 'true'
        run: mkdir _site && cp index.html lame.min.js _site/
      - name: Create project (first run only)
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages deploy _site --project-name="$PROJECT" --branch="${GITHUB_REF_NAME}" --commit-dirty=true
