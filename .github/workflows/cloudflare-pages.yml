name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: piano-maker
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID nu sunt setate - sar peste Cloudflare Pages."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build site
        if: steps.secrets.outputs.ok == 'true'
        run: mkdir _site && cp index.html lame.min.js _site/
      - name: Create project (first run only)
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages deploy _site --project-name="$PROJECT" --branch="${GITHUB_REF_NAME}" --commit-dirty=true
