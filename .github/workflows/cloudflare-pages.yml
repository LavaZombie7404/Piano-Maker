name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: piano-maker
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID nu sunt setate - sar peste Cloudflare Pages."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Cloudflare credentials
        if: steps.secrets.outputs.ok == 'true'
        run: |
          id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if ! printf '%s' "$id" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID nu arată ca un Account ID (trebuie 32 de caractere 0-9a-f, are ${#id})."
            exit 1
          fi
          accounts=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
          if [ "$(echo "$accounts" | jq -r .success)" != true ]; then
            echo "::error::Tokenul nu e acceptat de Cloudflare: $(echo "$accounts" | jq -c '.errors')"
            exit 1
          fi
          echo "Tokenul vede $(echo "$accounts" | jq '.result | length') cont(uri)."
          if ! echo "$accounts" | jq -e --arg id "$id" '.result | map(.id) | index($id)' >/dev/null; then
            echo "::error::Tokenul nu are acces la contul din CLOUDFLARE_ACCOUNT_ID (ID greșit sau token pe alt cont)."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          echo "Cheile sunt în regulă."
      - name: Build site
        if: steps.secrets.outputs.ok == 'true'
        run: mkdir _site && cp index.html lame.min.js _site/
      - name: Create project (first run only)
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages deploy _site --project-name="$PROJECT" --branch="${GITHUB_REF_NAME}" --commit-dirty=true
